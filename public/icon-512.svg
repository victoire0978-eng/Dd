<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGlow)" stroke-width="6" opacity="0.6" />

  <!-- Ambient Glow circle -->
  <circle cx="256" cy="256" r="140" fill="url(#primaryGlow)" opacity="0.15" filter="url(#glow)" />

  <!-- DAKIS stylized D Shape -->
  <path d="M 170 130 L 260 130 C 340 130 380 180 380 256 C 380 332 340 382 260 382 L 170 382 Z" fill="none" stroke="url(#primaryGlow)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Spark / Heart for ISMAEL & DAKIS -->
  <path d="M 256 210 C 245 195 225 195 215 208 C 200 225 210 248 256 285 C 302 248 312 225 297 208 C 287 195 267 195 256 210 Z" fill="url(#heartGrad)" filter="url(#glow)" />

  <!-- Small AI Sparkle Star -->
  <path d="M 335 155 L 340 175 L 360 180 L 340 185 L 335 205 L 330 185 L 310 180 L 330 175 Z" fill="#60a5fa" />
</svg>
